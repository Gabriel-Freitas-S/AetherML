name: Deploy Ingestion Worker

on:
  push:
    branches: ["main"]
    paths:
      - "workers/ingestion/**"
      - "packages/core-iqar/**"
      - "db/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: ingestion-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-ingestion:
    name: Test and Deploy Ingestion Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion worker tests
        run: npm --prefix workers/ingestion test

      - name: Apply D1 migrations to remote database
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ausente - migrations remotas abortadas."
            exit 1
          fi
          npx -y wrangler@4 d1 migrations apply aetherml-db --remote

      - name: Deploy Ingestion Worker to Cloudflare
        if: github.ref == 'refs/heads/main'
        working-directory: workers/ingestion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN ausente - deploy do worker de ingestão abortado."
            exit 1
          fi
          npx -y wrangler@4 deploy
