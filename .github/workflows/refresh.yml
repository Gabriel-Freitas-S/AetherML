name: Refresh Data Pipeline

# O deploy do Cloudflare Pages é feito por este pipeline no final do job (build + upload
# via wrangler), com o secret CLOUDFLARE_API_TOKEN (Account: Cloudflare Pages: Edit) e a
# variable CLOUDFLARE_ACCOUNT_ID — sem depender de webhooks nem de deploy manual.
# Sem este refresh diário dos artefatos estáticos (apps/web/public/data/*.json e ml/data/*.json),
# o site web/PWA cai no fallback do Open-Meteo por defasagem dos dados locais.

on:
  schedule:
    # Executa diariamente às 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and Commit Data Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline refresh
        run: python3 ml/refresh_all.py

      # Mensagem de commit sem flags de skip ([skip ci] etc.): o Cloudflare Pages
      # também lê a mensagem para omitir deploys (flags valem como prefixo). O deploy
      # deste pipeline é feito no próprio job, nos passos abaixo (build + upload),
      # então mantemos a mensagem limpa apenas por segurança.
      - name: Commit and push if artifacts changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain apps/web/public/data/ ml/data/)" ]; then
            git add apps/web/public/data/ ml/data/
            git commit -m "chore(data): refresh forecast e artefatos de dados"
            git pull --rebase --autostash
            git push
          else
            echo "Nenhuma alteração detectada em apps/web/public/data/ ou ml/data/."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ausente - deploy ignorado."
            exit 0
          fi
          npx -y wrangler@4 pages deploy apps/web/dist --project-name=aetherml --branch=main --commit-dirty=true
