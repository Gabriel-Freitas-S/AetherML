<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherML — Modo Offline</title>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(14, 116, 144, 0.4);
      padding: 2.5rem;
      border-radius: 1rem;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { color: #22d3ee; margin-top: 0; font-size: 1.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    button {
      background: #06b6d4;
      color: #090d16;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { background: #22d3ee; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AetherML — Conectividade Offline</h1>
    <p>Você está operando em uma zona de sombra ou sem conexão com a internet. O motor de inferência local continua ativo com os modelos em cache.</p>
    <button onclick="window.location.reload()">Tentar Reconectar</button>
  </div>
</body>
</html>
