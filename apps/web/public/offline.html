<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AetherML — Modo Offline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    body {
      background-color: #f6f9fc;
      background-image:
        radial-gradient(900px 420px at 12% -5%, rgba(14, 165, 233, 0.10), transparent 60%),
        radial-gradient(800px 380px at 88% 0%, rgba(16, 185, 129, 0.10), transparent 60%),
        linear-gradient(180deg, #f0f7fc 0%, #f8fafc 320px, #f8fafc 100%);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: max(1.5rem, env(safe-area-inset-top, 0px)) max(1.5rem, env(safe-area-inset-right, 0px)) max(1.5rem, env(safe-area-inset-bottom, 0px)) max(1.5rem, env(safe-area-inset-left, 0px));
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #cbd5e1;
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.1);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1.25rem;
      border-radius: 1rem;
    }
    h1 {
      color: #0f172a;
      margin: 0 0 0.5rem 0;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.55;
      margin: 0 0 1.5rem 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      margin-bottom: 1.25rem;
    }
    button {
      background: #0369a1;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.75rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
      transition: all 0.2s ease;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover {
      background: #075985;
      transform: translateY(-1px);
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/pwa-192x192.png" alt="AetherML" class="logo" />
    <div class="badge">
      <span>●</span> Modo Offline Ativo
    </div>
    <h1>Sem conexão com a internet</h1>
    <p>Você está offline no momento. O AetherML mantém os dados da última previsão salvos no seu aparelho para consulta imediata.</p>
    <button onclick="window.location.reload()">Tentar Reconectar</button>
  </div>
</body>
</html>
